<svg viewBox="0 0 680 720" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>企业知识库系统总体架构图</title>
<desc>从接入层到数据层的分层架构，展示认证、业务、任务、检索、模型、数据与可观测层</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="40" y="34" font-family="sans-serif" font-size="15" font-weight="500" fill="#26215C">企业知识库与智能业务服务平台 · 系统总体架构</text>

<g>
<rect x="40" y="52" width="600" height="46" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="75" font-family="sans-serif" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">接入层 · FastAPI API Gateway</text>
</g>

<g>
<rect x="40" y="112" width="600" height="46" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="135" font-family="sans-serif" font-size="13" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">认证层 · JWT + RBAC 权限校验</text>
</g>

<line x1="340" y1="98" x2="340" y2="112" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="40" y="172" width="600" height="118" rx="12" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="52" y="192" font-family="sans-serif" font-size="12" font-weight="500" fill="#444441">业务层</text>
<g>
<rect x="56" y="204" width="136" height="70" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
<text x="124" y="230" font-family="sans-serif" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">知识库管理</text>
<text x="124" y="248" font-family="sans-serif" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Knowledge Service</text>
</g>
<g>
<rect x="204" y="204" width="136" height="70" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
<text x="272" y="230" font-family="sans-serif" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">文档管理</text>
<text x="272" y="248" font-family="sans-serif" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Document Service</text>
</g>
<g>
<rect x="352" y="204" width="136" height="70" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
<text x="420" y="230" font-family="sans-serif" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">问答服务</text>
<text x="420" y="248" font-family="sans-serif" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">QA Service</text>
</g>
<g>
<rect x="500" y="204" width="124" height="70" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
<text x="562" y="226" font-family="sans-serif" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">异步任务调度</text>
<text x="562" y="248" font-family="sans-serif" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Celery Worker</text>
</g>
</g>

<line x1="340" y1="158" x2="340" y2="172" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="40" y="304" width="600" height="110" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="52" y="324" font-family="sans-serif" font-size="12" font-weight="500" fill="#085041">检索层</text>
<g>
<rect x="56" y="336" width="180" height="64" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
