<svg viewBox="0 0 680 700" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>在线智能问答流程图</title>
<desc>从用户提问到生成带引用答案的完整链路</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="40" y="34" font-family="sans-serif" font-size="15" font-weight="500" fill="#26215C">在线智能问答链路（问题 → 有依据的答案）</text>

<g>
<rect x="240" y="52" width="200" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="74" font-family="sans-serif" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">用户提交问题</text>
</g>

<g>
<rect x="240" y="120" width="200" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="142" font-family="sans-serif" font-size="13" fill="#3C3489" text-anchor="middle" dominant-baseline="central">JWT 验证 + 获取用户权限</text>
</g>

<line x1="340" y1="96" x2="340" y2="120" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="240" y="188" width="200" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="210" font-family="sans-serif" font-size="13" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Query Rewrite 问题改写</text>
</g>

<line x1="340" y1="164" x2="340" y2="188" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="240" y="256" width="200" height="44" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="340" y="278" font-family="sans-serif" font-size="13" font-weight="500" fill="#791F1F" text-anchor="middle" dominant-baseline="central">构建检索条件（含权限过滤）</text>
</g>

<line x1="340" y1="232" x2="340" y2="256" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="90" y="324" width="220" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="200" y="346" font-family="sans-serif" font-size="13" fill="#04342C" text-anchor="middle" dominant-baseline="central">BM25 关键词检索</text>
</g>

<g>
<rect x="370" y="324" width="220" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="480" y="346" font-family="sans-serif" font-size="13" fill="#04342C" text-anchor="middle" dominant-baseline="central">向量检索 Dense Retrieval</text>
</g>

<line x1="340" y1="300" x2="200" y2="324" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="300" x2="480" y2="324" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="240" y="392" width="200" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="414" font-family="sans-serif" font-size="13" fill="#04342C" text-anchor="middle" dominant-baseline="central">RRF 结果融合</text>
</g>

<line x1="200" y1="368" x2="320" y2="392" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="480" y1="368" x2="360" y2="392" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="240" y="460" width="200" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="482" font-family="sans-serif" font-size="13" fill="#04342C" text-anchor="middle" dominant-baseline="central">Reranker 重排序</text>
</g>

<line x1="340" y1="436" x2="340" y2="460" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="240" y="528" width="200" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="550" font-family="sans-serif" font-size="13" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">相关性是否足够？</text>
</g>

<line x1="340" y1="504" x2="340" y2="528" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="240" y="596" width="200" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="340" y="618" font-family="sans-serif" font-size="13" fill="#412402" text-anchor="middle" dominant-baseline="central">构建 Prompt → 调用 LLM</text>
</g>

<g>
<rect x="470" y="528" width="160" height="44" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="550" y="550" font-family="sans-serif" font-size="12" fill="#791F1F" text-anchor="middle" dominant-baseline="central">证据不足 → 拒答</text>
</g>

<line x1="340" y1="572" x2="340" y2="596" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="440" y1="550" x2="470" y2="550" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="240" y="664" width="200" height="44" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="340" y="686" font-family="sans-serif" font-size="13" font-weight="500" fill="#173404" text-anchor="middle" dominant-baseline="central">生成答案 + 引用溯源 → 返回</text>
</g>

<line x1="340" y1="640" x2="340" y2="664" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
