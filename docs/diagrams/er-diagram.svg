<line x1="415" y1="267" x2="490" y2="267" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="452" y="258" font-family="sans-serif" font-size="11" fill="#5F5E5A">contains</text>

<line x1="565" y1="294" x2="565" y2="340" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="580" y="320" font-family="sans-serif" font-size="11" fill="#5F5E5A">has</text>

<line x1="190" y1="367" x2="265" y2="367" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="228" y="358" font-family="sans-serif" font-size="11" fill="#5F5E5A">produces</text>

<line x1="415" y1="367" x2="490" y2="367" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="452" y="358" font-family="sans-serif" font-size="11" fill="#5F5E5A">processes</text>

<line x1="190" y1="467" x2="265" y2="467" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
